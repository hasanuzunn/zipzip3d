name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx cap sync android
      - name: Gradle ile APK derle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZipZip3D-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yı sürüm olarak yayınla
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZipZip3D.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ZipZip3D.apk --title "Zıp Zıp 3D (son sürüm)" --notes "Telefona indirip kurun. Kurulumda bilinmeyen kaynaklara izin verin."
        env:
          GH_TOKEN: ${{ github.token }}
